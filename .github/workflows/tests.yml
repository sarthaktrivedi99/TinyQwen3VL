name: Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Install CPU-only version of PyTorch to save time and bandwidth on GitHub Runners
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
        # Install remaining dependencies
        pip install -r requirements.txt
        
    - name: Run Tests
      # We explicitly call the test scripts created earlier
      run: |
        python -m unittest tests/test_rl.py tests/test_model.py tests/test_processor.py
